name: Обновление каталога

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день в 07:17 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать каталог
        run: python3 scripts/build_catalog.py
      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog README.md
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление каталога: $(date -u +%Y-%m-%d)"
            git push
          fi
